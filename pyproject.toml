[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-relation-check"
version = "0.1.0"
description = "Exact-string CSV relationship validation using temporary disk-backed joins"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "KanadeK"}]
dependencies = []
keywords = ["cli", "offline", "validation"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
csv-relation-check = "csv_relation_check.cli:main"

[project.urls]
Repository = "https://github.com/KanadeK/csv-relation-check"
Issues = "https://github.com/KanadeK/csv-relation-check/issues"

[tool.setuptools.packages.find]
include = ["csv_relation_check*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
